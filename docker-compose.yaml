services:
  postgres:
    image: postgres:15-alpine
    container_name: api_monitoring_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=chitvan
      - POSTGRES_PASSWORD=chitvan0305
      - POSTGRES_DB=api_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.postgres.sql:/docker-entrypoint-initdb.d/init.postgres.sql
    networks:
      - api-monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chitvan -d api_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  mongo:
    image: mongo:latest
    container_name: api_monitoring_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - api-monitoring-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=api_user
      - RABBITMQ_DEFAULT_PASS=chitvan0305
      - RABBITMQ_DEFAULT_VHOST=api_monitoring
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - api-monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: api_monitoring_pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=chitvan@admin.com
      - PGADMIN_DEFAULT_PASSWORD=chitvan0305
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - api-monitoring-network
    depends_on:
      postgres:
        condition: service_healthy

  api-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-monitoring-app
    environment:
      NODE_ENV: production
      PORT: 5000
      # MongoDB
      MONGODB_URI: mongodb://mongo:27017/api_monitoring
      MONGODB_DB: api_monitoring
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: api_monitoring
      POSTGRES_USER: chitvan
      POSTGRES_PASSWORD: chitvan0305
      # RabbitMQ
      RABBITMQ_URI: amqp://api_user:chitvan0305@rabbitmq:5672/api_monitoring
      RABBITMQ_QUEUE: api_hits
      # Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - api-monitoring-network
    depends_on:
      mongo:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  rabbitmq_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  api-monitoring-network:
    driver: bridge

  